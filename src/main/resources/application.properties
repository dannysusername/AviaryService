spring.profiles.active: main

# Load key=value pairs from a .env file in the project root (optional: no error if absent)
spring.config.import=optional:file:.env[.properties]
# Spring Boot Multipart Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Tomcat Server Limits
server.tomcat.max-http-form-post-size=55MB
server.tomcat.max-swallow-size=60MB

aviary.remember-me.key=${AVIARY_REMEMBER_ME_KEY:dev-remember-me-key-change-me}
aviary.aero-api-key.secret=${AVIARY_AERO_KEY:dev-only-fallback-not-secure}

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true